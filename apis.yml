aid: science-corporation
name: Science Corporation
description: >-
  Science Corporation is a neurotechnology company founded in 2021 by former Neuralink
  president Max Hodak, developing brain-computer interfaces and implantable neural devices
  to restore vision, cognition, and mobility (its PRIMA retinal implant and biohybrid BCI
  are its marquee programs). Its developer-facing surface is the Synapse Protocol, a flexible
  gRPC / Protocol Buffers standard API — paired with the Neural Data Transport Protocol
  (NDTP) — for discovering neural interface devices on a local network, configuring on-device
  signal chains (broadband source, spike detector, electrical/optical stimulation, disk
  writer, camera nodes), and streaming high-throughput neural data over UDP. Official client
  libraries ship for Python (science-synapse, including the synapsectl CLI), TypeScript, and
  C++, all generated from the open protobuf definitions in the sciencecorp GitHub org.
