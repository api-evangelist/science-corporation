apis:
- name: Synapse Protocol
  description: >-
    A flexible, powerful standard gRPC / Protocol Buffers API for neural interface devices.
    The SynapseDevice service exposes device discovery, info, configuration of on-device
    signal chains, start/stop, query and streaming query, application deployment, file
    management, logging, and device settings. Data streams to and from clients over UDP via
    the Neural Data Transport Protocol (NDTP).
